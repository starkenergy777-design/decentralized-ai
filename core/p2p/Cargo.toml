[package]
name = "decentralized-ai-p2p"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
futures = "0.3"
libp2p = { version = "0.57.1", features = ["tokio", "tcp", "quic", "noise", "yamux", "ping", "identify", "request-response", "cbor", "macros"] }
decentralized-ai-task-protocol = { path = "../task-protocol" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
